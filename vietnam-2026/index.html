<style>
/* Field-guide layout: hero, region tabs, photo cards in a responsive grid, then a day-by-day route */
:root{

}
@media (prefers-color-scheme: dark){:root{
  --bg:#1c1714; --surface:#251e1a; --ink:#efe7df; --muted:#b3a497; --line:#3a2f28;
  --karst:#d4b08c; --karst-soft:#3a2c22; --sun:#d9a86c; --sun-soft:#3d2f22; --river:#c9a98a; --shade:#2e2520; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{padding-block:48px 24px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--karst);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,7vw,60px);line-height:1.05;margin:10px 0 12px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-variant-numeric:tabular-nums}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;flex-wrap:wrap;padding-block:10px}
.tab{font:inherit;font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--karst);border-color:var(--karst);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--river);outline-offset:2px}
section.region{padding-block:28px 8px}
.region-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px}
h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,4vw,34px);margin:0}
.region-head p{margin:0;color:var(--muted)}
h3.group{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 12px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.route{border-color:var(--karst)}
.photos{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:3px;aspect-ratio:16/10;background:var(--shade);max-width:100%}
.photos a{display:block;overflow:hidden;position:relative;background:var(--shade)}
.photos a:first-child{grid-row:1/3}
.photos img{width:100%;height:100%;object-fit:cover}
.photos.one{grid-template-columns:1fr;grid-template-rows:1fr}
.photos.two{grid-template-rows:1fr}
.photos.two a:first-child{grid-row:auto}
.photos .empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:16px}
.body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.title-row{display:flex;justify-content:space-between;gap:10px;align-items:start}
.name{font-weight:700;font-size:17px;margin:0;line-height:1.3}
.vn{display:block;font-family:var(--display);color:var(--karst);font-size:15px;font-weight:400}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--karst-soft);color:var(--karst);white-space:nowrap}
.desc{margin:0}

@media (max-width:420px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.pick,.tab{transition:background .15s,color .15s}.photos img{transition:opacity .3s}}

const KEY = "vn-dec-2026-picks";
let mine = new Set();
try{ const v = JSON.parse(localStorage.getItem(KEY) || "[]"); if(Array.isArray(v)) mine = new Set(v); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify([...mine])); }catch(e){} }

const photoCache = {};
async function loadPhotos(p, box){
  try{
    let imgs = photoCache[p.id];
    if(!imgs){
      const url = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=6&gsrsearch=" +
        encodeURIComponent("filetype:bitmap " + p.cq) + "&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=640";
      const res = await fetch(url);
      const data = await res.json();
      const pages = data.query ? Object.values(data.query.pages).sort((a,b)=>a.index-b.index) : [];
      imgs = pages.filter(pg => pg.imageinfo && pg.imageinfo[0] && pg.imageinfo[0].thumburl).slice(0,3).map(pg => ({
        src: pg.imageinfo[0].thumburl, href: pg.imageinfo[0].descriptionurl, title: pg.title.replace(/^File:/,"").replace(/\.[a-z]+$/i,"")
      }));
      photoCache[p.id] = imgs;
    }
    box.textContent = "";
    if(!imgs.length) throw new Error("none");
    box.className = "photos" + (imgs.length === 1 ? " one" : imgs.length === 2 ? " two" : "");
    imgs.forEach((im, i) => {
      const a = document.createElement("a"); a.href = im.href; a.target = "_blank"; a.rel = "noopener"; a.title = im.title;
      const img = document.createElement("img"); img.src = im.src; img.alt = p.name + " photo " + (i+1); img.loading = "lazy";
      a.append(img); box.append(a);
    });
  }catch(e){
    box.textContent = "";
    const d = document.createElement("div"); d.className = "empty";
    const a = document.createElement("a"); a.href = googleImages(p); a.target = "_blank"; a.rel = "noopener"; a.textContent = "See photos of " + p.name + " →";
    d.append(a); box.append(d);
  }
}
const googleImages = p => "https://www.google.com/search?tbm=isch&q=" + encodeURIComponent(p.vn + " " + p.name + " Vietnam");

let filter = "all";
function card(p){

  const ph = document.createElement("div"); ph.className = "photos";
  const e = document.createElement("div"); e.className = "empty"; e.textContent = "Loading photos…"; ph.append(e);
  c.append(ph); loadPhotos(p, ph);
  const b = document.createElement("div"); b.className = "body";
  const tr = document.createElement("div"); tr.className = "title-row";
  const h = document.createElement("h4"); h.className = "name"; h.textContent = p.name;
  const vn = document.createElement("span"); vn.className = "vn"; vn.textContent = p.vn; h.append(vn);
  tr.append(h);
  if(p.route){ const bd = document.createElement("span"); bd.className = "badge"; bd.textContent = "On the route"; tr.append(bd); }
  const d = document.createElement("p"); d.className = "desc"; d.textContent = p.desc;
  const f = document.createElement("div"); f.className = "facts";
  [["Time", p.time], ["Getting there", p.from]].forEach(([k,v]) => { const s = document.createElement("span"); s.append(k + ": "); const bb = document.createElement("b"); bb.textContent = v; s.append(bb); f.append(s); });
  const dec = document.createElement("div"); dec.className = "dec"; dec.textContent = "December: " + p.dec;
  const act = document.createElement("div"); act.className = "actions";
  [["More photos", googleImages(p)], ["Video", "https://www.youtube.com/results?search_query=" + encodeURIComponent(p.vn + " " + p.name + " Vietnam travel")], ["Map", "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p.map)]]
    .forEach(([l,u]) => { const a = document.createElement("a"); a.href = u; a.target = "_blank"; a.rel = "noopener"; a.textContent = l; act.append(a); });
  const pk = document.createElement("button"); pk.className = "pick"; pk.dataset.id = p.id;
  act.append(pk); setPick(pk);
  pk.addEventListener("click", () => { mine.has(p.id) ? mine.delete(p.id) : mine.add(p.id); save(); setPick(pk); updateCount(); if(filter === "picked") render(); });
  b.append(tr, d, f, dec, act); c.append(b);
  return c;
}
function setPick(btn){ const on = mine.has(btn.dataset.id); btn.setAttribute("aria-pressed", on ? "true" : "false"); btn.textContent = on ? "Picked ✓" : "Pick"; }
function updateCount(){ document.getElementById("count").textContent = mine.size + " picked"; }

function render(){
  const root = document.getElementById("regions"); root.textContent = "";
  document.getElementById("route").hidden = !(filter === "all" || filter === "route");
  if(filter === "route"){ document.getElementById("route").scrollIntoView(); return; }
  for(const r of ["north","south"]){
    if((filter === "north" || filter === "south") && filter !== r) continue;
    let items = PLACES.filter(p => p.r === r);
    if(filter === "picked") items = items.filter(p => mine.has(p.id));
    if(!items.length) continue;
    const sec = document.createElement("section"); sec.className = "region";
    const head = document.createElement("div"); head.className = "region-head";
    const h2 = document.createElement("h2"); h2.textContent = REGIONS[r].title;
    const note = document.createElement("p"); note.textContent = REGIONS[r].note;
    head.append(h2, note); sec.append(head);
    const groups = [...new Set(items.map(p => p.g))];
    for(const g of groups){
      if(groups.length > 1 || r === "north"){ const gh = document.createElement("h3"); gh.className = "group"; gh.textContent = GROUPS[g]; sec.append(gh); }
      const grid = document.createElement("div"); grid.className = "grid";
      items.filter(p => p.g === g).forEach(p => grid.append(card(p)));
      sec.append(grid);
    }
    root.append(sec);
  }
  if(filter === "picked" && !root.children.length){
    const p = document.createElement("p"); p.className = "lede"; p.style.padding = "32px 0";
    p.textContent = "Nothing picked yet. Go to All and tap Pick on anything that looks good.";
    root.append(p);
  }
}
function renderRoute(){
  const legs = document.getElementById("legs");
  for(const L of LEGS){
    const el = document.createElement("div"); el.className = "leg";
    const h = document.createElement("h3"); h.textContent = L.title;
    const s = document.createElement("p"); s.className = "sub"; s.textContent = L.sub;
    const days = document.createElement("div"); days.className = "days";
    for(const d of L.days){
      const dy = document.createElement("div"); dy.className = "day";
      const dt = document.createElement("div"); dt.className = "date"; dt.textContent = d.d;
      const w = document.createElement("div"); w.className = "what"; w.textContent = d.w;
      const ul = document.createElement("ul"); d.n.forEach(t => { const li = document.createElement("li"); li.textContent = t; ul.append(li); });
      dy.append(dt, w, ul); days.append(dy);
    }
    el.append(h, s, days); legs.append(el);
  }
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  render();
}));

document.getElementById("share").addEventListener("click", async () => {
  const picked = PLACES.filter(p => mine.has(p.id));
  const status = document.getElementById("status");
  if(!picked.length){ status.textContent = "Pick a few places first."; return; }
  const text = "My Vietnam picks:\n" + picked.map(p => "• " + p.name + " (" + (p.r === "north" ? "North" : "South") + ")").join("\n");
  if(navigator.share){
    try{ await navigator.share({ title: "My Vietnam picks", text }); status.textContent = "Shared."; return; }catch(e){ if(e && e.name === "AbortError") return; }
  }
  try{ await navigator.clipboard.writeText(text); status.textContent = "Copied. Paste it into a message to Hana."; }
  catch(e){ status.textContent = picked.map(p => p.name).join(" · "); }
});

updateCount(); renderRoute(); render();
</script>
</body>
</html>
